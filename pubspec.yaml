name: gestor_proyectos
description: Mesa de Ayuda — tickets y proyectos internos Surgicorp
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_animate: ^4.5.2
  file_picker: ^8.1.7
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_surgi.png
    - assets/images/logo_surgi_trim.png
    - assets/images/logo_surgi_mark.png
