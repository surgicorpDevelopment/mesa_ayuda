server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter Web usa base-href /app_mesaayuda/ — los assets viven en la raíz del contenedor.
    # IIS reescribe /app_mesaayuda/(.*) → localhost:8010/{R:1}, así nginx recibe rutas sin el prefijo.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wasm)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
